name: Build & Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ninja
        run: python -m pip install --upgrade ninja

      - name: Cache toolchain and third-party dependencies
        uses: actions/cache@v4
        with:
          path: |
            tools/llvm-mingw
            third_party
          key: padsplit-deps-${{ runner.os }}-${{ hashFiles('scripts/setup_deps.py') }}

      - name: Fetch pinned toolchain and dependencies
        run: python scripts/setup_deps.py

      - name: Build x64 & x86 binaries
        run: python build.py

      - name: Run automated test suite
        run: python scripts/run_tests.py

      - name: Package portable release archive
        run: python scripts/package_release.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PadSplit-win-x64
          path: |
            build/release/PadSplit-v*-win-x64.zip
            build/release/SHA256SUMS.txt

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/release/PadSplit-v*-win-x64.zip
            build/release/SHA256SUMS.txt
